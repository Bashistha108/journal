server:
  port: ${TJ_SERVER_PORT:8080}
  address: 127.0.0.1

spring:
  datasource:
    url: jdbc:postgresql://${TJ_DB_HOST:127.0.0.1}:${TJ_DB_PORT:5432}/${TJ_DB_NAME:trading_journal}
    username: ${TJ_DB_USER:trading_journal}
    password: ${TJ_DB_PASSWORD:trading_journal_pass}
    hikari:
      connection-timeout: 5000
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    liquibase-schema: public
    default-schema: tj_meta
    drop-first: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 160MB

tj:
  allowed-hosts: ${TJ_ALLOWED_HOSTS:localhost,127.0.0.1}
  allowed-origins: ${TJ_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
